<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Helping Hands</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/animations.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <style>
        .auth-container { min-height: 100vh; display: flex; align-items: center; background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); }
        .auth-form { background: var(--white); padding: 40px; border-radius: 15px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2); width: 100%; max-width: 450px; }
        .auth-form h2 { color: var(--primary); margin-bottom: 30px; font-weight: 700; }
        .form-group { margin-bottom: 20px; }
        .password-toggle { position: absolute; right: 15px; top: 38px; cursor: pointer; color: var(--primary); }
        .demo-credentials { background: #FFF3E0; border-left: 4px solid var(--accent); padding: 15px; border-radius: 5px; margin-bottom: 20px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top navbar-light bg-white shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html"><i class="fas fa-hands-helping"></i> Helping Hands</a>
        </div>
    </nav>
    <div class="auth-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5 fadeInUp">
                    <div class="auth-form">
                        <h2><i class="fas fa-sign-in-alt"></i> Welcome Back</h2>
                        <div class="demo-credentials">
                            <h6><i class="fas fa-info-circle"></i> Demo Account</h6>
                            <p class="mb-2"><strong>Username:</strong> testuser</p>
                            <p class="mb-0"><strong>Password:</strong> Test@123</p>
                        </div>
                        <form id="loginForm">
                            <div class="form-group">
                                <label class="form-label">Username or Email</label>
                                <input type="text" class="form-control" id="username" required>
                            </div>
                            <div class="form-group position-relative">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" required>
                                <i class="fas fa-eye password-toggle" onclick="togglePassword('password')"></i>
                            </div>
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="remember">
                                <label class="form-check-label" for="remember">Remember me</label>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mb-3 ripple-btn"><i class="fas fa-sign-in-alt"></i> Login</button>
                        </form>
                        <p class="text-center text-muted">Don't have an account? <a href="register.html" class="text-primary fw-bold">Register</a></p>
                        <hr>
                        <p class="text-center text-muted small"><a href="admin/admin-login.html" class="text-primary">Admin Login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/validation.js"></script>
    <script>
        if (isLoggedIn()) { window.location.href = 'dashboard/dashboard.html'; }
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            let user = getUserByUsername(username) || getUserByEmail(username);
            if (!user) { showToast('User not found', 'danger'); return; }
            if (user.password !== password) { showToast('Incorrect password', 'danger'); return; }
            setCurrentUser(user);
            showToast('Login successful!', 'success');
            setTimeout(() => { window.location.href = 'dashboard/dashboard.html'; }, 1000);
        });
        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            field.type = field.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>
