<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Helping Hands</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/animations.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <style>
        .auth-container { min-height: 100vh; display: flex; align-items: center; background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); }
        .auth-form { background: var(--white); padding: 40px; border-radius: 15px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2); width: 100%; max-width: 500px; }
        .auth-form h2 { color: var(--primary); margin-bottom: 30px; font-weight: 700; }
        .form-group { margin-bottom: 20px; }
        .password-toggle { position: absolute; right: 15px; top: 38px; cursor: pointer; color: var(--primary); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top navbar-light bg-white shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html"><i class="fas fa-hands-helping"></i> Helping Hands</a>
        </div>
    </nav>
    <div class="auth-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 fadeInUp">
                    <div class="auth-form">
                        <h2><i class="fas fa-user-plus"></i> Create Account</h2>
                        <form id="registerForm">
                            <div class="form-group">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="fullName" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" required>
                                <small class="text-muted" id="usernameHelp"></small>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="email" required>
                                <small class="text-muted" id="emailHelp"></small>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" id="phone" required>
                            </div>
                            <div class="form-group position-relative">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" required>
                                <i class="fas fa-eye password-toggle" onclick="togglePassword('password')"></i>
                                <small class="text-muted d-block mt-2">Min 8 chars, uppercase, number, special char</small>
                            </div>
                            <div class="form-group position-relative">
                                <label class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" id="confirmPassword" required>
                                <i class="fas fa-eye password-toggle" onclick="togglePassword('confirmPassword')"></i>
                                <small class="text-muted" id="passwordMatch"></small>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mb-3 ripple-btn"><i class="fas fa-check"></i> Create Account</button>
                        </form>
                        <p class="text-center text-muted">Already have an account? <a href="login.html" class="text-primary fw-bold">Login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/validation.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value;
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            if (!validateUsername(username)) { showToast('Username must be 4+ characters', 'danger'); return; }
            if (!validateEmail(email)) { showToast('Invalid email address', 'danger'); return; }
            if (getUserByEmail(email)) { showToast('Email already registered', 'danger'); return; }
            if (!validatePassword(password)) { showToast('Password must be 8+ chars', 'danger'); return; }
            if (password !== confirmPassword) { showToast('Passwords do not match', 'danger'); return; }
            const newUser = { name: fullName, username: username, email: email, phone: phone, password: password, avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${username}` };
            addUser(newUser);
            showToast('Account created successfully!', 'success');
            setTimeout(() => { window.location.href = 'login.html'; }, 1500);
        });
        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            field.type = field.type === 'password' ? 'text' : 'password';
        }
        document.getElementById('username').addEventListener('blur', function() {
            const username = this.value;
            const help = document.getElementById('usernameHelp');
            if (username.length < 4) {
                help.textContent = '❌ Username must be at least 4 characters';
                help.classList.add('text-danger');
            } else if (getUserByUsername(username)) {
                help.textContent = '❌ Username already taken';
                help.classList.add('text-danger');
            } else {
                help.textContent = '✓ Username available';
                help.classList.remove('text-danger');
                help.classList.add('text-success');
            }
        });
    </script>
</body>
</html>
